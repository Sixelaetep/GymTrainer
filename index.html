<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PT Companion v2.2</title>
<!-- PT Companion — version 2.2 — bump this comment + <title> + loginVersion + topBarVersion + VERSION const together on every release -->

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PT Companion">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ============ DESIGN TOKENS ============
   Palette: Charcoal ink / Chalk white / Slate / Amber highlighter accent
   Signature: amber "marker" underline on headline stats (progression/PBs) —
   evokes a coach circling a number on a whiteboard.
*/
:root{
  --ink:#1C2128;
  --ink-soft:#262C35;
  --slate:#3A4552;
  --chalk:#F5F3EE;
  --chalk-dim:#D8D4C9;
  --amber:#E8A33D;
  --amber-dim:#F0C079;
  --good:#4C8C6B;
  --bad:#C1554A;
  --line:rgba(245,243,238,0.12);
  --shadow:0 8px 24px rgba(0,0,0,0.28);
  --radius:14px;
  --display:'Barlow Condensed', sans-serif;
  --body:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:0.01em;margin:0;}
button{font-family:var(--body);cursor:pointer;}
input,select,textarea{font-family:var(--body);}
a{color:var(--amber);}
::selection{background:var(--amber);color:var(--ink);}

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2px solid var(--amber); outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

.hidden{display:none !important;}

/* ---------- Login ---------- */
#loginScreen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 20px; text-align:center;
}
.brandmark{
  width:64px;height:64px;border-radius:16px;background:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  border:1px solid var(--line);
}
.brandmark svg{width:34px;height:34px;}
#loginScreen h1{font-size:30px;margin-bottom:4px;}
.tagline{color:var(--chalk-dim);font-size:14px;margin-bottom:28px;}
.loginCard{
  width:100%;max-width:340px;background:var(--ink-soft);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:left;
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--chalk-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
.field input{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink);color:var(--chalk);font-size:16px;
}
.btnPrimary{
  width:100%;padding:12px;border:none;border-radius:10px;background:var(--amber);
  color:var(--ink);font-weight:700;font-size:15px;margin-top:6px;
}
.btnPrimary:disabled{opacity:0.55;cursor:not-allowed;}
.loginError{color:var(--bad);font-size:13px;margin-top:10px;min-height:16px;}
.loginHint{color:var(--chalk-dim);font-size:12px;margin-top:18px;max-width:320px;line-height:1.5;}
.loginVersion{color:var(--chalk-dim);opacity:0.55;font-size:11px;margin-top:14px;font-family:var(--mono);}

/* ---------- App shell ---------- */
#appShell{min-height:100vh;display:flex;flex-direction:column;}
#topBar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
  background:var(--ink-soft);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10;
}
#topBar h1{font-size:22px;}
.topBarVersion{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--chalk-dim);opacity:0.6;vertical-align:middle;margin-left:2px;}
.syncDot{width:9px;height:9px;border-radius:50%;background:var(--chalk-dim);display:inline-block;margin-right:7px;}
.syncDot.ok{background:var(--good);}
.syncDot.err{background:var(--bad);}
.syncDot.pending{background:var(--amber);}
#syncBtn{
  display:flex;align-items:center;background:transparent;border:1px solid var(--line);
  color:var(--chalk-dim);font-size:12px;border-radius:20px;padding:6px 12px;
}

#mainArea{flex:1;padding:16px;padding-bottom:calc(150px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;}

.searchRow{display:flex;gap:8px;margin-bottom:14px;}
.searchRow input{
  flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink-soft);color:var(--chalk);font-size:16px;
}

.clientCard{
  background:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  transition:border-color .15s;
}
.clientCard:active{border-color:var(--amber);}
.clientCard .cName{font-size:17px;font-weight:600;}
.clientCard .cMeta{color:var(--chalk-dim);font-size:12.5px;margin-top:3px;}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;letter-spacing:.02em;}
.tagChip{
  display:inline-block;margin:0 6px 6px 0;padding:7px 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--ink);color:var(--chalk-dim);
  font-size:13px;font-weight:600;
}
.tagChip.on{background:var(--amber);color:var(--ink);border-color:var(--amber);}

.pillResult{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  width:100%;text-align:left;padding:10px 14px;margin-bottom:6px;border-radius:12px;
  border:1px solid var(--line);background:var(--ink-soft);color:var(--chalk);
}
.pillResult .prName{font-weight:600;font-size:14.5px;}
.pillResult .prMeta{font-size:11.5px;color:var(--chalk-dim);}
.pillResult.pillCreate{color:var(--amber);font-weight:600;border-style:dashed;}

.setRow{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.setRow .setIdx{font-size:11px;color:var(--chalk-dim);width:16px;flex-shrink:0;}
.setRow input{
  flex:1;min-width:0;padding:9px 8px;border-radius:8px;border:1px solid var(--line);
  background:var(--ink);color:var(--chalk);font-size:15px;
}
.badge.active{background:rgba(76,140,107,0.18);color:var(--good);}
.badge.archived{background:rgba(255,255,255,0.08);color:var(--chalk-dim);}

.emptyState{
  text-align:center;padding:60px 20px;color:var(--chalk-dim);
}
.emptyState .glyph{font-size:40px;margin-bottom:10px;}

.fab{
  position:fixed;right:20px;bottom:calc(78px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:var(--amber);color:var(--ink);
  border:none;font-size:28px;font-weight:700;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;line-height:0;
  z-index:20;
}

#bottomNav{
  position:fixed;left:0;right:0;bottom:0;display:flex;
  background:var(--ink-soft);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:15;
}
.navTab{
  flex:1;background:none;border:none;color:var(--chalk-dim);font-size:11px;font-weight:600;
  padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.navTab .navIcon{font-size:19px;line-height:1;}
.navTab.active{color:var(--amber);}

/* ---------- Sheet / modal ---------- */
.sheetBackdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--ink-soft);width:100%;max-width:640px;border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
  border-top:1px solid var(--line);
}
.sheetHandle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;}
.sheetHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.sheetHeader h2{font-size:22px;}
.iconBtn{background:none;border:none;color:var(--chalk-dim);font-size:20px;padding:4px 8px;}

.tabRow{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.tabBtn{
  background:none;border:none;color:var(--chalk-dim);font-size:14px;font-weight:600;
  padding:9px 4px;border-bottom:2px solid transparent;margin-right:16px;
}
.tabBtn.active{color:var(--amber);border-bottom-color:var(--amber);}

.statRow{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap;}
.stat{}
.stat .num{
  font-family:var(--mono);font-size:26px;font-weight:600;position:relative;display:inline-block;
}
.stat .num.highlight::after{
  content:'';position:absolute;left:-2px;right:-2px;bottom:1px;height:9px;
  background:var(--amber);opacity:0.35;transform:rotate(-1deg);z-index:-1;border-radius:2px;
}
.stat .lbl{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

textarea.notesArea{
  width:100%;min-height:80px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--ink);color:var(--chalk);font-size:16px;resize:vertical;
}

.rowActions{display:flex;gap:10px;margin-top:18px;}
.btnGhost{
  flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--chalk);font-weight:600;font-size:14px;
}
.btnDanger{color:var(--bad);border-color:rgba(193,85,74,0.4);}
.btnAmber{
  flex:1;padding:11px;border-radius:10px;border:none;background:var(--amber);color:var(--ink);
  font-weight:700;font-size:14px;
}

.phasePlaceholder{
  text-align:center;color:var(--chalk-dim);padding:36px 10px;font-size:13.5px;line-height:1.6;
}

/* ---------- Sync drawer ---------- */
.drawerRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.drawerRow span:first-child{color:var(--chalk-dim);}
.drawerRow span:last-child{font-family:var(--mono);}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  background:var(--chalk);color:var(--ink);padding:10px 18px;border-radius:20px;font-size:13.5px;
  font-weight:600;box-shadow:var(--shadow);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1;}

/* print styles reserved for programme PDF export in Phase 3 */
@media print{
  #topBar,.fab,#bottomNav,.sheetBackdrop .iconBtn{display:none !important;}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="brandmark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="10.5" width="20" height="3" rx="1.5" fill="#E8A33D"/>
      <rect x="0" y="7" width="4" height="10" rx="2" fill="#E8A33D"/>
      <rect x="20" y="7" width="4" height="10" rx="2" fill="#E8A33D"/>
      <rect x="1" y="9" width="2" height="6" rx="1" fill="#F5F3EE"/>
      <rect x="21" y="9" width="2" height="6" rx="1" fill="#F5F3EE"/>
    </svg>
  </div>
  <h1>PT Companion</h1>
  <div class="tagline">Programmes, sessions and progress — all in one place</div>
  <div class="loginCard">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" inputmode="email">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <button class="btnPrimary" id="loginBtn">Log in</button>
    <div class="loginError" id="loginError"></div>
  </div>
  <div class="loginHint">Accounts are created by your admin in Supabase — there's no sign-up here. Lost access? Ask them to reset your password.</div>
  <div class="loginVersion" id="loginVersion">v2.2</div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell" class="hidden">
  <div id="topBar">
    <h1>PT Companion <span class="topBarVersion" id="topBarVersion">v2.2</span></h1>
    <button id="syncBtn"><span class="syncDot" id="syncDot"></span><span id="syncLabel">Sync</span></button>
  </div>

  <div id="mainArea">
    <div class="searchRow">
      <input id="mainSearch" type="text" placeholder="Search…">
    </div>
    <div id="mainList"></div>
  </div>

  <button class="fab" id="mainFab" title="Add">+</button>

  <div id="bottomNav">
    <button class="navTab active" data-tab="clients"><span class="navIcon">👤</span>Clients</button>
    <button class="navTab" data-tab="templates"><span class="navIcon">📋</span>Templates</button>
    <button class="navTab" data-tab="exercises"><span class="navIcon">🏋️</span>Exercises</button>
    <button class="navTab" data-tab="tags"><span class="navIcon">🏷️</span>Tags</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
   PT COMPANION — index.html
   Phase 1: auth, client roster, robust sync engine, PWA shell.
   Phase 2+: programmes, PDF export, session logging, insights.
   ========================================================================= */
const VERSION = '2.2';
// v2.2: Exercise picker & structured sets, matching Gym Tracker's actual
// UX/data model more closely. The exercise dropdown (unusable at 65+
// entries) is replaced with a live search returning tappable pill results
// (name, trackType, top tags), plus a "+ Create as new exercise" pill when
// there's no exact match — mirrors Gym Tracker's session-search pattern.
// Target sets are no longer one free-text sets/reps/weight per item —
// each item now holds an array of individual target sets, fields adapting
// to the exercise's trackType (reps: reps+weight; time: min:sec;
// distance: metres+min:sec+optional weight), with add/remove per set —
// matching Gym Tracker's targetSets model. v2.0/v2.1 items migrate
// automatically; anything that couldn't be cleanly parsed (e.g. "8-12"
// rep ranges) is preserved in the item's notes rather than dropped.
const LS_KEY  = 'pt_companion_v1';

// ---- Critical UI: runs first, unconditionally, before anything risky -----
// (version display is now static HTML above — see v1.5 note. Only the
// button/keyboard wiring needs to happen here in JS.)
document.getElementById('loginBtn').addEventListener('click', () => doLogin());
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

// ---- Supabase config -----------------------------------------------------
// Anon key is safe to ship client-side — RLS is what actually protects data.
const SUPABASE_URL      = 'https://gnzxsbbmfwmtkqidxgoj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduenhzYmJtZndtdGtxaWR4Z29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MjE0OTAsImV4cCI6MjA5NzI5NzQ5MH0.Jr-EiAdmpwuj69tJ7zRK22L7I2oiQaO3oWnu1uB915A';
const SESSION_KEY = 'pt_companion_sb_session';

// ---- Raw Supabase REST calls — no SDK, no CDN, matches the launcher's
// proven pattern exactly (direct fetch() to Supabase's own REST API rather
// than a third-party JS library). This was the actual root cause of every
// prior login failure: the app depended on loading @supabase/supabase-js
// from a public CDN, and that CDN load was evidently being blocked. fetch()
// straight to *.supabase.co has no such dependency.
async function sbSignIn(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Sign in failed');
  return data;
}
async function sbRefreshSession(refreshToken){
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    if (!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function sbSignOut(accessToken){
  try{
    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + accessToken }
    });
  }catch(e){}
}
// Raw REST wrapper for pt_* tables (PostgREST). RLS on the tables still
// enforces auth.uid() = trainer_id — that's derived from the JWT in the
// Authorization header, identically whether sent via the SDK or via fetch.
async function sbFetch(path, options={}){
  const headers = Object.assign({
    'Content-Type': 'application/json',
    'apikey': SUPABASE_ANON_KEY
  }, options.headers || {});
  if (_session && _session.access_token) headers['Authorization'] = 'Bearer ' + _session.access_token;
  return fetch(SUPABASE_URL + path, Object.assign({}, options, { headers }));
}

// ---- Local envelope -------------------------------------------------------
// {version, lastUpdated, lastExported, data:{clients:[...], exercises:[...], programs:[...]}}
// Backwards-compatible: a v1.6 backup with only `clients` still loads fine —
// exercises/programs default to empty arrays rather than failing.
function defaultEnv(){
  return { version: 1, lastUpdated: new Date().toISOString(), lastExported: null, data: { clients: [], exercises: [], programs: [], tags: [] } };
}
let _env = load();
let _envGeneration = 0; // guards against a stale in-flight pull overwriting a fresher import/replace

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultEnv();
    const parsed = JSON.parse(raw);
    if (typeof parsed.version !== 'number') throw new Error('Missing version field');
    parsed.data = parsed.data || {};
    parsed.data.clients   = Array.isArray(parsed.data.clients)   ? parsed.data.clients   : [];
    parsed.data.exercises = Array.isArray(parsed.data.exercises) ? parsed.data.exercises : [];
    parsed.data.programs  = Array.isArray(parsed.data.programs)  ? parsed.data.programs  : [];
    parsed.data.tags      = Array.isArray(parsed.data.tags)      ? parsed.data.tags      : [];
    migrateLegacyExercises(parsed.data.exercises);
    migrateLegacyProgramItems(parsed.data.programs);
    return parsed;
  }catch(e){
    console.error('Local envelope load failed, starting fresh:', e);
    return defaultEnv();
  }
}
function save(env){
  env.lastUpdated = new Date().toISOString();
  localStorage.setItem(LS_KEY, JSON.stringify(env));
}
function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

// ---- Retry queue (persisted — survives reload/offline blips) -------------
const RETRY_KEY = 'pt_companion_retry_v1';
function loadRetryQueue(){ try{ return JSON.parse(localStorage.getItem(RETRY_KEY)) || []; }catch(e){ return []; } }
function saveRetryQueue(q){ localStorage.setItem(RETRY_KEY, JSON.stringify(q)); }
let _retryQueue = loadRetryQueue();

function queueRetry(table, record){
  _retryQueue = _retryQueue.filter(r => !(r.table===table && r.record.id===record.id)); // dedupe, latest wins
  _retryQueue.push({ table, record, queuedAt: new Date().toISOString() });
  saveRetryQueue(_retryQueue);
  renderSyncStatus();
}
async function flushRetryQueue(){
  if (!_retryQueue.length || !getUserId()) return;
  const remaining = [];
  for (const item of _retryQueue){
    const ok = await pushRecord(item.table, item.record, true);
    if (!ok) remaining.push(item);
  }
  _retryQueue = remaining;
  saveRetryQueue(_retryQueue);
  renderSyncStatus();
}

// ---- Auth ------------------------------------------------------------------
let _session = null;
function getUserId(){ return _session && _session.user ? _session.user.id : null; }

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if (!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Logging in…';
  try{
    const session = await sbSignIn(email, password);
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    onAuthed(session);
  }catch(err){
    console.error('Login failed:', err);
    errEl.textContent = err && err.message ? err.message : 'Login failed. Check your connection and try again.';
  }finally{
    btn.disabled = false; btn.textContent = 'Log in';
  }
}

async function initAuth(){
  const stored = localStorage.getItem(SESSION_KEY);
  if (stored){
    try{
      const parsed = JSON.parse(stored);
      const refreshed = await sbRefreshSession(parsed.refresh_token);
      if (refreshed){
        localStorage.setItem(SESSION_KEY, JSON.stringify(refreshed));
        onAuthed(refreshed);
        return;
      }
    }catch(e){ console.error('Session restore failed:', e); }
    localStorage.removeItem(SESSION_KEY);
  }
  // No valid session — login screen is already showing by default.
}

function onAuthed(session){

// ---- Sync engine -------------------------------------------------------
// Pattern (matches Gym Tracker / pal-sync semantics):
//  - every record carries updatedAt + optional _deleted:true tombstone
//  - push = upsert to cloud, keyed by record id, scoped by trainer_id (RLS)
//  - pull = merge cloud rows into local by id; cloud wins on conflict
//  - a tombstone is only dropped locally once the cloud copy of that id is
//    ALSO a confirmed tombstone — an unconfirmed local delete keeps retrying
//    rather than silently vanishing if the push hasn't landed yet
//  - failed pushes go to a persisted retry queue, flushed on reconnect
let _syncState = 'idle'; // idle | syncing | ok | error

async function pushRecord(table, record, isRetry){
  if (!getUserId()) { queueRetry(table, record); return false; }
  const payload = { id: record.id, trainer_id: getUserId(), data: record, updated_at: record.updatedAt || new Date().toISOString() };
  try{
    const res = await sbFetch(`/rest/v1/${table}`, {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([payload])
    });
    if (!res.ok){
      console.error('push failed', table, record.id, res.status, await res.text().catch(()=>''));
      if (!isRetry) queueRetry(table, record);
      _syncState = 'error'; renderSyncStatus();
      return false;
    }
    return true;
  }catch(err){
    console.error('push threw', table, record.id, err);
    if (!isRetry) queueRetry(table, record);
    _syncState = 'error'; renderSyncStatus();
    return false;
  }
}

async function pullTable(table, localArrKey){
  if (!getUserId()) return;
  let rows;
  try{
    const res = await sbFetch(`/rest/v1/${table}?select=id,data,updated_at`);
    if (!res.ok){
      console.error('pull failed', table, res.status, await res.text().catch(()=>''));
      _syncState='error'; renderSyncStatus(); return;
    }
    rows = await res.json();
  }catch(err){
    console.error('pull threw', table, err);
    _syncState='error'; renderSyncStatus(); return;
  }
  const myGen = ++_envGeneration;
  const localArr = _env.data[localArrKey] || [];
  const byId = new Map(localArr.map(r => [r.id, r]));
  (rows || []).forEach(row => {
    const cloudRec = row.data;
    cloudRec.id = row.id;
    const localRec = byId.get(row.id);
    if (!localRec){
      byId.set(row.id, cloudRec); // new from cloud
      return;
    }
    const cloudTime = new Date(row.updated_at).getTime();
    const localTime = new Date(localRec.updatedAt || 0).getTime();
    if (localRec._deleted && !cloudRec._deleted){
      // unconfirmed local tombstone — keep it, re-push so cloud catches up
      queueRetry(table, localRec);
      return;
    }
    if (cloudTime >= localTime){
      byId.set(row.id, cloudRec); // cloud preferred in conflicts
    }
  });
  if (myGen !== _envGeneration) return; // a newer pull/import superseded this one mid-flight
  _env.data[localArrKey] = Array.from(byId.values());
  save(_env);
}

async function pullAll(){
  _syncState = 'syncing'; renderSyncStatus();
  await pullTable('pt_clients', 'clients');
  await pullTable('pt_exercises', 'exercises');
  await pullTable('pt_programs', 'programs');
  await pullTable('pt_tags', 'tags');
  migrateLegacyExercises(_env.data.exercises);
  migrateLegacyProgramItems(_env.data.programs);
  save(_env);
  _syncState = 'ok'; renderSyncStatus();
}

function persistAndSync(table, localArrKey, record){
  save(_env);
  pushRecord(table, record, false);
}

document.getElementById('syncBtn').addEventListener('click', async () => {
  if (!getUserId()){ toast('Not connected to cloud'); return; }
  _syncState = 'syncing'; renderSyncStatus();
  await pullAll();
  await flushRetryQueue();
  renderMainArea();
  toast('Synced ✓');
});

function renderSyncStatus(){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'syncDot ' + (_syncState==='ok' ? 'ok' : _syncState==='error' ? 'err' : _retryQueue.length ? 'pending' : '');
  if (_syncState==='syncing') label.textContent = 'Syncing…';
  else if (_retryQueue.length) label.textContent = _retryQueue.length + ' pending';
  else if (_syncState==='error') label.textContent = 'Sync error';
  else if (getUserId()) label.textContent = 'Synced';
  else label.textContent = 'Offline';
}

// ---- Programme helpers (shared by client programmes & templates) --------
function activeExercises(){
  return (_env.data.exercises || []).filter(e => !e._deleted && e.status !== 'archived');
}
function allPrograms(){ return _env.data.programs || []; }
function templates(){ return allPrograms().filter(p => !p._deleted && p.kind === 'template'); }
function clientProgrammes(clientId){ return allPrograms().filter(p => !p._deleted && p.kind==='client' && p.clientId===clientId); }
function activeProgrammeFor(clientId){ return clientProgrammes(clientId).find(p => p.status === 'active'); }

function fmtMinSec(seconds){
  seconds = Number(seconds)||0;
  const m = Math.floor(seconds/60), s = seconds%60;
  return m>0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}s`;
}
function itemSummary(item){
  const sets = item.targetSets || [];
  if (!sets.length) return item.notes || 'No target set';
  const n = sets.length;
  if (item.trackType === 'time'){
    return `${n} set${n===1?'':'s'} · ${sets.map(s=>fmtMinSec(s.seconds)).join(', ')}`;
  }
  if (item.trackType === 'distance'){
    return `${n} set${n===1?'':'s'} · ${sets.map(s=>`${s.metres||0}m in ${fmtMinSec(s.seconds)}`).join(', ')}`;
  }
  return `${n} set${n===1?'':'s'} · ${sets.map(s=>`${s.reps||0}${s.weight?'×'+s.weight+'kg':''}`).join(', ')}`;
}

function renderItemList(container, items, onEdit, onRemove){
  if (!items.length){
    container.innerHTML = '<div class="emptyState" style="padding:24px 10px;">No exercises added yet.</div>';
    return;
  }
  container.innerHTML = items.map((it,idx) => `
    <div class="clientCard" data-idx="${idx}" style="margin-bottom:8px;">
      <div>
        <div class="cName">${escHtml(it.exerciseName)}</div>
        <div class="cMeta">${escHtml(itemSummary(it))}</div>
      </div>
      <button class="iconBtn" data-remove="${idx}" title="Remove">✕</button>
    </div>
  `).join('');
  container.querySelectorAll('.clientCard').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('[data-remove]')) return;
      onEdit(Number(el.dataset.idx));
    });
  });
  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); onRemove(Number(btn.dataset.remove)); });
  });
}

function defaultSetForType(type){
  return type==='distance' ? {metres:1000, seconds:300, weight:0} : type==='time' ? {seconds:30} : {reps:10, weight:0};
}

// Opens a stacked sheet to add/edit one exercise-assignment within a
// programme or template. `onSave` receives the finished item.
function openItemSheet(existingItem, onSave){
  const item = existingItem ? JSON.parse(JSON.stringify(existingItem)) : { itemId: uuid(), exerciseId:'', exerciseName:'', trackType:'reps', targetSets:[], notes:'' };
  const backdrop = document.createElement('div');
  backdrop.className = 'sheetBackdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheetHandle"></div>
      <div class="sheetHeader"><h2>${existingItem ? 'Edit exercise' : 'Add exercise'}</h2><button class="iconBtn" data-close>✕</button></div>
      <div id="ifPickerZone"></div>
      <div id="ifSetsZone"></div>
      <div class="rowActions"><button class="btnAmber" id="ifSave" disabled>${existingItem ? 'Save' : 'Add to programme'}</button></div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', e => { if (e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector('[data-close]').addEventListener('click', () => backdrop.remove());

  const pickerZone = backdrop.querySelector('#ifPickerZone');
  const setsZone = backdrop.querySelector('#ifSetsZone');
  const saveBtn = backdrop.querySelector('#ifSave');

  function renderPicked(){
    saveBtn.disabled = !item.exerciseId;
    pickerZone.innerHTML = `
      <div class="field"><label>Exercise</label>
        <div class="clientCard" style="margin-bottom:4px;">
          <div><div class="cName">${escHtml(item.exerciseName)}</div><div class="cMeta">Tracked as ${escHtml(item.trackType)}</div></div>
          <button class="iconBtn" id="ifChangeEx" title="Change exercise">✎</button>
        </div>
      </div>
    `;
    pickerZone.querySelector('#ifChangeEx').addEventListener('click', renderSearch);
    renderSets();
  }

  function renderSearch(){
    saveBtn.disabled = true;
    setsZone.innerHTML = '';
    pickerZone.innerHTML = `
      <div class="field"><label>Find exercise</label><input id="ifSearch" type="text" placeholder="Search by name or tag…" autocomplete="off"></div>
      <div id="ifResults"></div>
    `;
    const searchEl = pickerZone.querySelector('#ifSearch');
    const resultsEl = pickerZone.querySelector('#ifResults');
    function renderResults(){
      const q = searchEl.value.trim().toLowerCase();
      if (!q){ resultsEl.innerHTML = '<div class="cMeta" style="padding:6px 2px;">Type to search your exercise library…</div>'; return; }
      const matches = activeExercises()
        .filter(e => e.name.toLowerCase().includes(q) || (e.tags||[]).some(t=>t.toLowerCase().includes(q)))
        .slice(0, 8);
      const exactMatch = activeExercises().some(e => e.name.toLowerCase() === q);
      let html = matches.map(e => `
        <button type="button" class="pillResult" data-id="${escHtml(e.id)}">
          <span class="prName">${escHtml(e.name)}</span>
          <span class="prMeta">${escHtml(e.trackType||'reps')}${(e.tags&&e.tags.length) ? ' · '+escHtml(e.tags.slice(0,3).join(', ')) : ''}</span>
        </button>
      `).join('');
      if (!matches.length) html += '<div class="cMeta" style="padding:6px 2px;">No matches.</div>';
      if (!exactMatch){
        html += `<button type="button" class="pillResult pillCreate" id="ifCreateNew">+ Create "${escHtml(searchEl.value.trim())}" as new exercise</button>`;
      }
      resultsEl.innerHTML = html;
      resultsEl.querySelectorAll('.pillResult[data-id]').forEach(btn => {
        btn.addEventListener('click', () => selectExercise(btn.dataset.id));
      });
      const createBtn = resultsEl.querySelector('#ifCreateNew');
      if (createBtn) createBtn.addEventListener('click', () => quickCreateExercise(searchEl.value.trim()));
    }
    searchEl.addEventListener('input', renderResults);
    renderResults();
    searchEl.focus();
  }

  function selectExercise(exId){
    const ex = activeExercises().find(e => e.id === exId);
    if (!ex) return;
    const typeChanged = item.exerciseId && item.trackType !== ex.trackType;
    item.exerciseId = ex.id;
    item.exerciseName = ex.name;
    if (typeChanged || !item.targetSets.length){
      item.trackType = ex.trackType;
      item.targetSets = [defaultSetForType(ex.trackType)];
    }
    renderPicked();
  }

  // Quick-create: opens the real exercise sheet pre-filled with the search
  // term, then selects the new exercise here once saved — no need to leave
  // this screen and lose progress on the item you were building.
  function quickCreateExercise(name){
    openExerciseSheetInline(name, (newEx) => { selectExercise(newEx.id); });
  }

  function renderSets(){
    const sets = item.targetSets;
    const type = item.trackType;
    const rows = sets.map((s, si) => {
      if (type === 'distance'){
        return `<div class="setRow" data-si="${si}">
          <span class="setIdx">${si+1}</span>
          <input type="number" min="0" placeholder="metres" value="${s.metres||''}" data-f="metres">
          <input type="number" min="0" placeholder="min" style="max-width:64px" value="${Math.floor((s.seconds||0)/60)}" data-f="min">
          <input type="number" min="0" max="59" placeholder="sec" style="max-width:64px" value="${(s.seconds||0)%60}" data-f="sec">
          <input type="number" min="0" step="0.5" placeholder="kg (opt)" value="${s.weight||''}" data-f="weight">
          <button type="button" class="iconBtn" data-remove="${si}">✕</button>
        </div>`;
      }
      if (type === 'time'){
        return `<div class="setRow" data-si="${si}">
          <span class="setIdx">${si+1}</span>
          <input type="number" min="0" placeholder="min" value="${Math.floor((s.seconds||0)/60)}" data-f="min">
          <input type="number" min="0" max="59" placeholder="sec" value="${(s.seconds||0)%60}" data-f="sec">
          <button type="button" class="iconBtn" data-remove="${si}">✕</button>
        </div>`;
      }
      return `<div class="setRow" data-si="${si}">
        <span class="setIdx">${si+1}</span>
        <input type="number" min="0" placeholder="reps" value="${s.reps||''}" data-f="reps">
        <input type="number" min="0" step="0.5" placeholder="kg" value="${s.weight||''}" data-f="weight">
        <button type="button" class="iconBtn" data-remove="${si}">✕</button>
      </div>`;
    }).join('');
    setsZone.innerHTML = `
      <div class="field"><label>Target sets</label><div id="ifSetRows">${rows}</div>
        <div class="rowActions"><button type="button" class="btnGhost" id="ifAddSet">+ Add set</button></div>
      </div>
      <div class="field"><label>Coaching notes for this exercise (optional)</label><input id="ifNotes" type="text" value="${escHtml(item.notes)}" placeholder="e.g. 3 sec eccentric, wide grip"></div>
    `;
    setsZone.querySelectorAll('.setRow input').forEach(inp => {
      inp.addEventListener('input', () => {
        const si = Number(inp.closest('.setRow').dataset.si);
        const field = inp.dataset.f;
        const set = sets[si];
        if (field === 'min'){ const sec=(set.seconds||0)%60; set.seconds = (Number(inp.value)||0)*60 + sec; }
        else if (field === 'sec'){ const min=Math.floor((set.seconds||0)/60); set.seconds = min*60 + (Number(inp.value)||0); }
        else { set[field] = inp.type==='number' ? (inp.value===''?0:Number(inp.value)) : inp.value; }
      });
    });
    setsZone.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => { sets.splice(Number(btn.dataset.remove),1); renderSets(); });
    });
    setsZone.querySelector('#ifAddSet').addEventListener('click', () => {
      const last = sets[sets.length-1];
      sets.push(last ? Object.assign({}, last) : defaultSetForType(type));
      renderSets();
    });
    setsZone.querySelector('#ifNotes').addEventListener('input', e => { item.notes = e.target.value; });
  }

  if (item.exerciseId) renderPicked(); else renderSearch();

  saveBtn.addEventListener('click', () => {
    if (!item.exerciseId){ toast('Choose an exercise'); return; }
    onSave(item);
    backdrop.remove();
  });
}

function renderClientProgrammeTab(body, client){
  const active = activeProgrammeFor(client.id);
  const history = clientProgrammes(client.id).filter(p => p.status === 'archived')
    .sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));

  if (!active){
    body.innerHTML = `
      <div class="phasePlaceholder">This client has no active programme yet.</div>
      <div class="rowActions">
        <button class="btnGhost" id="pfBlank">Blank programme</button>
        <button class="btnAmber" id="pfAssign">Assign template</button>
      </div>
      ${history.length ? `<h3 style="font-size:15px;margin:20px 0 10px;">History</h3><div id="pfHistory"></div>` : ''}
    `;
  } else {
    body.innerHTML = `
      <div class="statRow">
        <div class="stat"><div class="num">${active.items.length}</div><div class="lbl">Exercises</div></div>
      </div>
      <div class="field"><label>Programme name</label><input id="pfName" type="text" value="${escHtml(active.name)}"></div>
      <div id="pfItemList"></div>
      <div class="rowActions"><button class="btnGhost" id="pfAddItem">+ Add exercise</button></div>
      <div class="rowActions">
        <button class="btnGhost btnDanger" id="pfArchive">Archive programme</button>
        <button class="btnAmber" id="pfSaveName">Save name</button>
      </div>
      ${history.length ? `<h3 style="font-size:15px;margin:20px 0 10px;">History</h3><div id="pfHistory"></div>` : ''}
    `;
    const itemListEl = body.querySelector('#pfItemList');
    const refreshItems = () => renderItemList(itemListEl, active.items,
      (idx) => openItemSheet(active.items[idx], (updated) => { active.items[idx]=updated; active.updatedAt=new Date().toISOString(); persistAndSync('pt_programs','programs',active); refreshItems(); renderProgHeader(); }),
      (idx) => { active.items.splice(idx,1); active.updatedAt=new Date().toISOString(); persistAndSync('pt_programs','programs',active); refreshItems(); renderProgHeader(); }
    );
    function renderProgHeader(){ body.querySelector('.stat .num').textContent = active.items.length; }
    refreshItems();
    body.querySelector('#pfAddItem').addEventListener('click', () => {
      openItemSheet(null, (item) => { active.items.push(item); active.updatedAt=new Date().toISOString(); persistAndSync('pt_programs','programs',active); refreshItems(); renderProgHeader(); });
    });
    body.querySelector('#pfSaveName').addEventListener('click', () => {
      const name = body.querySelector('#pfName').value.trim();
      if (!name){ toast('Name is required'); return; }
      active.name = name; active.updatedAt = new Date().toISOString();
      persistAndSync('pt_programs','programs',active);
      toast('Saved');
    });
    body.querySelector('#pfArchive').addEventListener('click', () => {
      if (!confirm(`Archive "${active.name}"? You can still view it in history.`)) return;
      active.status = 'archived'; active.updatedAt = new Date().toISOString();
      persistAndSync('pt_programs','programs',active);
      renderClientProgrammeTab(body, client);
      toast('Programme archived');
    });
  }

  const blankBtn = body.querySelector('#pfBlank');
  if (blankBtn) blankBtn.addEventListener('click', () => {
    const name = prompt('Programme name:', 'New programme');
    if (!name) return;
    const prog = { id: uuid(), kind:'client', clientId: client.id, name: name.trim(), notes:'', status:'active', items:[], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    _env.data.programs = _env.data.programs || [];
    _env.data.programs.push(prog);
    persistAndSync('pt_programs','programs',prog);
    renderClientProgrammeTab(body, client);
  });
  const assignBtn = body.querySelector('#pfAssign');
  if (assignBtn) assignBtn.addEventListener('click', () => openTemplatePicker((tpl) => {
    assignTemplateToClient(client, tpl);
    renderClientProgrammeTab(body, client);
    toast('Template assigned');
  }));

  const histEl = body.querySelector('#pfHistory');
  if (histEl){
    histEl.innerHTML = history.map(p => `
      <details style="margin-bottom:8px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;">

      </details>
    `).join('');
  }
}

function assignTemplateToClient(client, template){
  const existing = activeProgrammeFor(client.id);
  if (existing){
    existing.status = 'archived';
    existing.updatedAt = new Date().toISOString();
    persistAndSync('pt_programs','programs',existing);
  }
  const prog = {
    id: uuid(), kind:'client', clientId: client.id, name: template.name, notes: template.notes || '',
    status:'active', items: template.items.map(it => Object.assign({}, it, {
      itemId: uuid(),
      targetSets: (it.targetSets||[]).map(s => Object.assign({}, s))
    })),
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
  _env.data.programs = _env.data.programs || [];
  _env.data.programs.push(prog);
  persistAndSync('pt_programs','programs',prog);
}

// One-time, non-destructive migration for exercises created in v2.0, which
// had a single `type` field (strength/cardio/mobility/other) and no tags.
// Maps the old field to the new trackType vocabulary (reps/distance/time)
// used for session logging in a later phase, and ensures `tags` exists.
function migrateLegacyExercises(exercises){
  const legacyMap = { strength:'reps', cardio:'distance', mobility:'time', other:'reps' };
  (exercises||[]).forEach(e => {
    if (!e.trackType){
      e.trackType = (e.type && legacyMap[e.type]) || 'reps';
    }
    if (!Array.isArray(e.tags)) e.tags = [];
  });
}

// One-time, non-destructive migration for programme/template items created
// in v2.0/v2.1, which stored a single free-text sets/reps/weight per item
// instead of an array of individual target sets. Best-effort numeric parse;
// anything that can't be cleanly parsed is preserved in the item's notes
// rather than silently dropped.
function migrateLegacyProgramItems(programs){
  (programs||[]).forEach(p => {
    (p.items||[]).forEach(item => {
      if (Array.isArray(item.targetSets)) return; // already v2.2+
      if (!item.trackType) item.trackType = 'reps';
      const setCount = parseInt(item.sets, 10) || 1;
      const repsNum = parseInt(item.reps, 10);
      const weightNum = parseFloat(item.weight);
      const built = [];
      for (let i=0; i<setCount; i++){
        if (item.trackType === 'time') built.push({ seconds: 0 });
        else if (item.trackType === 'distance') built.push({ metres:0, seconds:0, weight: isNaN(weightNum)?0:weightNum });
        else built.push({ reps: isNaN(repsNum)?0:repsNum, weight: isNaN(weightNum)?0:weightNum });
      }
      item.targetSets = built;
      const legacyBits = [item.sets && `${item.sets} sets`, item.reps && `${item.reps} reps`, item.weight].filter(Boolean).join(', ');
      if (legacyBits && (isNaN(repsNum) || isNaN(weightNum))){
        item.notes = (item.notes ? item.notes + ' — ' : '') + `(was: ${legacyBits})`;
      }
      delete item.sets; delete item.reps; delete item.weight;
    });
  });
}

function loadStarterTags(){
  const existingNames = new Set(activeTags().map(t => t.name.toLowerCase()));
  const now = new Date().toISOString();
  let added = 0;
  _env.data.tags = _env.data.tags || [];
  TAG_STARTER_LIBRARY.forEach(item => {
    if (existingNames.has(item.name.toLowerCase())) return;
    const record = { id: uuid(), name: item.name, bodyArea: item.bodyArea, createdAt: now, updatedAt: now };
    _env.data.tags.push(record);
    persistAndSync('pt_tags', 'tags', record);
    existingNames.add(item.name.toLowerCase());
    added++;
  });
  renderTagList();
  toast(added ? `Added ${added} tag${added===1?'':'s'} ✓` : 'All starter tags already in your library');
}

  const exercises = (_env.data.exercises||[]).filter(e => !e._deleted && (!q || (e.name||'').toLowerCase().includes(q) || (e.tags||[]).some(t=>t.toLowerCase().includes(q))))
    .sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const seedBtn = '<div class="rowActions" style="margin-bottom:12px;"><button class="btnGhost" id="seedExBtn">+ Load starter library (from Gym Tracker)</button></div>';
  if (!exercises.length){
    list.innerHTML = seedBtn + '<div class="emptyState"><div class="glyph">🏋️</div>Add exercises to build programmes from.</div>';
  } else {
    list.innerHTML = seedBtn + exercises.map(e => `
      <div class="clientCard" data-id="${escHtml(e.id)}">
        <div><div class="cName">${escHtml(e.name)}</div><div class="cMeta">${escHtml(e.trackType||'reps')}${(e.tags&&e.tags.length) ? ' · '+escHtml(e.tags.join(', ')) : ''}</div></div>
        <span class="badge ${e.status==='archived'?'archived':'active'}">${e.status==='archived'?'Archived':'Active'}</span>
      </div>
    `).join('');
  }
  list.querySelectorAll('.clientCard').forEach(el => el.addEventListener('click', () => openExerciseSheet(el.dataset.id)));
  const seed = list.querySelector('#seedExBtn');
  if (seed) seed.addEventListener('click', loadStarterExercises);
}

function openExerciseSheet(id){
  const ex = id ? (_env.data.exercises||[]).find(e=>e.id===id) : { id: uuid(), name:'', trackType:'reps', tags:[], notes:'', status:'active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
  const isNew = !id;
  const trackTypes = ['reps','distance','time'];
  let selectedTags = (ex.tags||[]).slice();
  const backdrop = document.createElement('div');
  backdrop.className = 'sheetBackdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheetHandle"></div>
      <div class="sheetHeader"><h2>${isNew ? 'Add exercise' : 'Edit exercise'}</h2><button class="iconBtn" data-close>✕</button></div>
      <div class="field"><label>Name</label><input id="efName" type="text" value="${escHtml(ex.name)}" placeholder="e.g. Barbell Back Squat"></div>
      <div class="field"><label>Tracked as</label>
        <select id="efTrackType" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--chalk);font-size:16px;">
          ${trackTypes.map(t => `<option value="${t}" ${ex.trackType===t?'selected':''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Tags (body areas)</label><div id="efTagChips"></div></div>
      <div class="field"><label>How to perform (notes)</label><textarea id="efNotes" class="notesArea" placeholder="Cues, technique, setup instructions…">${escHtml(ex.notes)}</textarea></div>
      ${!isNew ? `<div class="field"><label>Status</label>
        <select id="efStatus" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--chalk);font-size:16px;">
          <option value="active" ${ex.status==='active'?'selected':''}>Active</option>
          <option value="archived" ${ex.status==='archived'?'selected':''}>Archived</option>
        </select></div>` : ''}
      <div class="rowActions">
        ${!isNew ? '<button class="btnGhost btnDanger" id="efDelete">Delete</button>' : ''}
        <button class="btnAmber" id="efSave">${isNew ? 'Add exercise' : 'Save'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', e => { if (e.target===backdrop) backdrop.remove(); });
  backdrop.querySelector('[data-close]').addEventListener('click', () => backdrop.remove());

  const chipsEl = backdrop.querySelector('#efTagChips');
  function renderChips(){
    const available = activeTags();
    if (!available.length){
      chipsEl.innerHTML = '<div class="cMeta">No tags yet — add some in the Tags tab first.</div>';
      return;
    }
    chipsEl.innerHTML = available.map(t => `
      <button type="button" class="tagChip ${selectedTags.includes(t.name)?'on':''}" data-tag="${escHtml(t.name)}">${escHtml(t.name)}</button>
    `).join('');
    chipsEl.querySelectorAll('.tagChip').forEach(chip => {
      chip.addEventListener('click', () => {
        const name = chip.dataset.tag;
        if (selectedTags.includes(name)) selectedTags = selectedTags.filter(t=>t!==name);
        else selectedTags.push(name);
        renderChips();
      });
    });
  }
  renderChips();

  backdrop.querySelector('#efSave').addEventListener('click', () => {
    const name = backdrop.querySelector('#efName').value.trim();
    if (!name){ toast('Name is required'); return; }
    ex.name = name;
    ex.trackType = backdrop.querySelector('#efTrackType').value;
    ex.tags = selectedTags.slice();
    ex.notes = backdrop.querySelector('#efNotes').value;
    const statusEl = backdrop.querySelector('#efStatus');
    if (statusEl) ex.status = statusEl.value;
    ex.updatedAt = new Date().toISOString();
    if (isNew){
      _env.data.exercises = _env.data.exercises || [];
      _env.data.exercises.push(ex);
    }
    persistAndSync('pt_exercises', 'exercises', ex);
    renderExerciseList();
    backdrop.remove();
    toast(isNew ? 'Exercise added' : 'Saved');
  });
  const delBtn = backdrop.querySelector('#efDelete');
  if (delBtn) delBtn.addEventListener('click', () => {
    if (!confirm(`Delete "${ex.name}"? This can't be undone.`)) return;
    ex._deleted = true; ex.updatedAt = new Date().toISOString();
    persistAndSync('pt_exercises', 'exercises', ex);
    renderExerciseList();
    backdrop.remove();
    toast('Exercise deleted');
  });
}

function loadStarterExercises(){
  const existingNames = new Set((_env.data.exercises||[]).filter(e=>!e._deleted).map(e => e.name.toLowerCase()));
  const now = new Date().toISOString();
  let added = 0;
  _env.data.exercises = _env.data.exercises || [];
  EXERCISE_STARTER_LIBRARY.forEach(item => {
    if (existingNames.has(item.name.toLowerCase())) return;
    const record = { id: uuid(), name:item.name, trackType:item.trackType, tags:item.tags.slice(), notes:'', status:'active', createdAt:now, updatedAt:now };
    _env.data.exercises.push(record);
    persistAndSync('pt_exercises', 'exercises', record);
    existingNames.add(item.name.toLowerCase());
    added++;
  });
  renderExerciseList();
  const skipped = EXERCISE_STARTER_LIBRARY.length - added;
  toast(added ? `Added ${added} exercise${added===1?'':'s'}${skipped?' · '+skipped+' already existed':''} ✓` : 'All starter exercises already in your library');
}

// ---- Toast ---------------------------------------------------------------
let _toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

// ---- Boot ------------------------------------------------------------------
renderSyncStatus();
initAuth();
</script>
</body>
</html>
